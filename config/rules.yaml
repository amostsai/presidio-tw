version: 1
ner:
  enabled: true
  model_name: ckiplab/bert-base-chinese-ner
  device: -1
  score: 0.85
  chunk_size: 400
  overlap: 64
  mapping:
    PERSON: PERSON
    ORG: ORGANIZATION
rules:
- name: 台灣身分證
  entity: TW_NATIONAL_ID
  enabled: true
  context:
  - 身分證
  - 身份證
  - 證號
  - ID
  patterns:
  - name: tw_id
    regex: (?<![A-Za-z0-9])[A-Z][12][0-9]{8}(?![A-Za-z0-9])
    score: 0.95
  field_keys:
  - id_number
  - national_id
  - 身分證字號
  - 身份證字號
  - 身分證
  - 身份證
- name: 台灣統一編號
  entity: TW_TAX_ID
  enabled: true
  validator: tw_tax_id
  context:
  - 統一編號
  - 統編
  - 稅籍編號
  patterns:
  - regex: (?<![0-9])[0-9]{8}(?![0-9])
    score: 0.7
  field_keys:
  - tax_id
  - 統一編號
  - 統編
- name: 台灣手機
  entity: PHONE_NUMBER
  enabled: true
  context:
  - 手機
  - 電話
  - 行動電話
  - 聯絡方式
  patterns:
  - regex: (?<![0-9])09[0-9]{2}[-\s]?[0-9]{3}[-\s]?[0-9]{3}(?![0-9])
    score: 0.85
  field_keys:
  - mobile
  - phone
  - telephone
  - 手機
  - 行動電話
  - 手機號碼
  - 電話
  - 室內電話
- name: 姓名欄位
  entity: PERSON
  enabled: true
  patterns:
  - regex: (?m)(?<=^[ \t]*(?:姓名|中文姓名|聯絡人|聯絡人姓名|收件人|收件人姓名)[ \t]*[:：][ \t]*)[\p{Han}·．・]{2,12}(?=[
      \t]*\r?$)
    score: 1.0
  field_keys:
  - name
  - full_name
  - fullname
  - person_name
  - contact_name
  - recipient_name
  - 姓名
  - 中文姓名
  - 聯絡人
  - 收件人
  field_value_regex: (?=\s*\S)[^\r\n]{1,120}
- name: 地址欄位
  entity: LOCATION
  enabled: true
  patterns:
  - regex: (?m)(?<=^[ \t]*(?:通訊地址|聯絡地址|戶籍地址|居住地址|住址|地址|收件地址)[ \t]*[:：][ \t]*)[^\r\n]{2,160}
    score: 1.0
  - name: full_tw_address
    regex: (?:[0-9]{3}(?:[0-9]{2,3})?[ \t]*)?(?:(?:臺|台)[北中南]市|新北市|桃園市|高雄市|基隆市|新竹市|嘉義市|(?:宜蘭|新竹|苗栗|彰化|南投|雲林|嘉義|屏東|花蓮|臺東|台東|澎湖|金門|連江)縣)[
      \t]*(?:[\p{Han}]{1,6}(?:區|鄉|鎮|市)[ \t]*)?[\p{Han}0-9０-９]{1,20}(?:路|街|大道)[ \t]*(?:[0-9０-９一二三四五六七八九十百零〇]{1,6}段[
      \t]*)?(?:[0-9０-９一二三四五六七八九十百零〇]{1,6}巷[ \t]*)?(?:[0-9０-９一二三四五六七八九十百零〇]{1,6}弄[
      \t]*)?[0-9０-９一二三四五六七八九十百零〇]{1,6}(?:之[0-9０-９]{1,4})?號(?:之[0-9０-９]{1,4})?(?:[
      \t]*[0-9０-９一二三四五六七八九十百零〇]{1,4}樓(?:之[0-9０-９]{1,4})?)?
    score: 1.0
  field_keys:
  - address
  - mailing_address
  - contact_address
  - residential_address
  - shipping_address
  - 通訊地址
  - 聯絡地址
  - 戶籍地址
  - 住址
  - 地址
  field_value_regex: '[^\r\n]{2,160}'
exclusions: []
